<style>
  :root {
    --bg: #FFF6EC;
    --ink: #2A1E1A;
    --ink-soft: #8A7A72;
    --focus: #E8503A;
    --focus-soft: #FFE3DC;
    --short: #3FA77E;
    --short-soft: #D8F0E7;
    --long: #4E7BDB;
    --long-soft: #DCE7FB;
    --card: #FFFDF8;
    --line: rgba(42,30,26,.08);
    --ring: var(--focus);
    --ring-soft: var(--focus-soft);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ---------- background art layer ---------- */
  .art-layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .art {
    position: absolute;
    top: 50%; left: 50%;
    width: min(92vmin, 640px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    opacity: 0;
    transition: opacity .8s ease;
  }
  .art.on { opacity: .16; }
  @media (prefers-color-scheme: dark) {
    .art.on { opacity: .10; }
  }

  .shell {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    padding: 28px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  /* ---------- wordmark ---------- */
  .topbar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .wordmark {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .12em;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lang-select {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(42,30,26,.05);
  }
  .lang-select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .wordmark .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--focus);
    box-shadow: 0 0 0 4px var(--focus-soft);
    transition: background .5s, box-shadow .5s;
  }

  /* ---------- mode tabs ---------- */
  .modes {
    display: flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    gap: 2px;
    margin-bottom: 26px;
    box-shadow: 0 2px 12px rgba(42,30,26,.05);
  }
  .modes button {
    appearance: none;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .25s, color .25s;
  }
  .modes button.active {
    background: var(--ring);
    color: #fff;
    transition: background .5s;
  }
  .modes button:not(.active):hover { color: var(--ink); }
  .modes button:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  /* ---------- ring timer ---------- */
  .timer {
    position: relative;
    width: min(78vw, 320px);
    aspect-ratio: 1;
    margin-bottom: 8px;
  }
  .timer svg { width: 100%; height: 100%; display: block; }
  .ring-bg { fill: none; stroke: var(--ring-soft); stroke-width: 10; transition: stroke .5s; }
  .ring-fg {
    fill: none;
    stroke: var(--ring);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke .5s;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
  }
  .timer-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .clock {
    font-size: clamp(56px, 17vw, 76px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink);
  }
  .clock-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: .08em;
  }

  /* ---------- controls ---------- */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin: 18px 0 26px;
  }
  .btn {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .15s, box-shadow .2s, background .3s, color .3s;
  }
  .btn:active { transform: scale(.96); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .btn-primary {
    background: var(--ring);
    color: #fff;
    font-size: 17px;
    padding: 14px 36px;
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0,0,0,.14);
    transition: background .5s;
    min-width: 150px;
  }
  .btn-ghost {
    background: var(--card);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 999px;
  }
  .btn-ghost:hover { color: var(--ink); }

  /* ---------- stats ---------- */
  .stats {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-bottom: 22px;
  }
  .stat {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 8px;
    text-align: center;
  }
  .stat .num {
    font-size: 26px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    line-height: 1.2;
  }
  .stat .cap {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    margin-top: 2px;
  }
  .stat.done .num { color: var(--focus); }

  /* ---------- settings ---------- */
  .settings {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: .04em;
  }
  .field input[type=number] {
    appearance: none;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 10px;
    padding: 9px 12px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    width: 100%;
  }
  .field input[type=number]:focus { outline: 2px solid var(--ring); outline-offset: 1px; }
  .field.check {
    flex-direction: row;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .field.check input {
    width: 20px; height: 20px;
    accent-color: var(--ring);
    cursor: pointer;
  }

  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.7;
  }

  /* ---------- dark mode ---------- */
  @media (prefers-color-scheme: dark) {
    body { background: #17140F; color: #F3EDE4; }
    :root {
      --ink: #F3EDE4;
      --ink-soft: #A79E94;
      --card: #221E18;
      --line: rgba(255,246,236,.10);
      --focus-soft: #4A2A24;
      --short-soft: #1E3A30;
      --long-soft: #24304A;
    }
    .field input[type=number] { background: #2B2620; color: var(--ink); }
    .btn-primary { box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  }

  /* ---------- completion flash ---------- */
  .timer.done .clock { animation: pop .6s ease; }
  @keyframes pop { 40% { transform: scale(1.08); } }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

    mode: { focus: '集中', shortBreak: '短休憩', longBreak: '長休憩' },
    idle: { focus: '集中準備', shortBreak: '少し休む', longBreak: 'たっぷり休む' },
    start: '開始', pause: '停止', reset: 'リセット',
    stat: { today: '今日のトマト', minutes: '集中分数', streak: '連続' },
    set: { focus: '集中（分）', short: '短休憩（分）', long: '長休憩（分）', sound: '終了音' },
    hint: { space: 'スペースキーで開始 / 停止 · 4回ごとに自動で長休憩', save: '進捗は自動的に保存' },
    titlePrefix: 'ポモドーロ'
  },
  'ko': {
    brand: '토마토 타이머',
    mode: { focus: '집중', shortBreak: '짧은 휴식', longBreak: '긴 휴식' },
    idle: { focus: '집중 준비', shortBreak: '잠시 쉬어요', longBreak: '철저하게 쉬세요' },
    start: '시작', pause: '일시정지', reset: '리셋',
    stat: { today: '오늘', minutes: '집중 분', streak: '연속' },
    set: { focus: '집중(분)', short: '짧은 휴식(분)', long: '긴 휴식(분)', sound: '종료 알림음' },
    hint: { space: 'space 키로 시작 / 일시정지 · 4개마다 긴 휴식 자동', save: '진행은 이 기기에 자동 저장' },
    titlePrefix: '토마토'
  }
};
const langSelect = document.getElementById('langSelect');
function applyLang(lang) {
  const t = I18N[lang] || I18N['zh'];
  document.documentElement.lang = (lang === 'zh-TW' ? 'zh-Hant' : lang);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const parts = el.getAttribute('data-i18n').split('.');
    const v = parts.reduce((o, k) => (o && o[k]), t);
    if (v != null) el.textContent = v;
  });
  document.getElementById('brandName').textContent = t.brand;
  document.getElementById('startBtn').textContent = t.start;
  document.getElementById('resetBtn').textContent = t.reset;
  // mode tab buttons have data-i18n too, but ensure consistency
  langSelect.value = lang;
  // refresh dynamic labels
  if (typeof applyModeColors === 'function') applyModeColors();
  render();
  localStorage.setItem('pomodoro_lang', lang);
}

// ---------- config ----------
const MODES = {
  focus:      { label: '专注',   color: 'var(--focus)', soft: 'var(--focus-soft)', idle: '准备专注' },
  shortBreak: { label: '短休息', color: 'var(--short)', soft: 'var(--short-soft)', idle: '休息一下' },
  longBreak:  { label: '长休息', color: 'var(--long)',  soft: 'var(--long-soft)',  idle: '好好放松' }
};
const LS = {
  read() { try { return JSON.parse(localStorage.getItem('pomodoro_v1') || '{}'); } catch { return {}; } },
  save(d) { localStorage.setItem('pomodoro_v1', JSON.stringify(d)); }
};
let state = Object.assign({ mode: 'focus', durations: { focus: 1500, shortBreak: 300, longBreak: 900 },
                           sound: true, today: null, todayCount: 0, todayMin: 0, streak: 0, lastDay: null },
                          LS.read());
// day rollover
const todayStr = new Date().toISOString().slice(0, 10);
if (state.today !== todayStr) {
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  state.streak = (state.lastDay === y) ? state.streak + 1 : 1;
  state.today = todayStr; state.todayCount = 0; state.todayMin = 0; state.lastDay = todayStr;
  LS.save(state);
}

// ---------- dom ----------
const $ = id => document.getElementById(id);
const clockEl = $('clock'), labelEl = $('clockLabel'), ring = $('ringFg'),
      startBtn = $('startBtn'), dot = $('dot'), timerEl = $('timer');
const CIRC = 2 * Math.PI * 52;
ring.setAttribute('stroke-dasharray', CIRC);

// restore inputs from state
$('fMin').value = Math.round(state.durations.focus / 60);
$('sMin').value = Math.round(state.durations.shortBreak / 60);
$('lMin').value = Math.round(state.durations.longBreak / 60);
$('sound').checked = state.sound;

let remaining = state.durations[state.mode];   // seconds
let running = false, endAt = 0, tickId = null;

function fmt(s) {
  s = Math.max(0, Math.ceil(s));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function render() {
  clockEl.textContent = fmt(remaining);
  const t = I18N[currentLang] || I18N['zh'];
  const idle = t.idle[state.mode] || '';
  document.title = running ? fmt(remaining) + ' · ' + t.brand : t.brand + ' · ' + idle;
  const frac = state.durations[state.mode] ? remaining / state.durations[state.mode] : 0;
  ring.setAttribute('stroke-dashoffset', CIRC * (1 - Math.min(1, Math.max(0, frac))));
  timerEl.classList.toggle('done', !running && remaining === 0);
}

function applyModeColors() {
  const m = MODES[state.mode];
  const r = getComputedStyle(document.documentElement);
  document.documentElement.style.setProperty('--ring', m.color);
  document.documentElement.style.setProperty('--ring-soft', m.soft);
  const t = I18N[currentLang] || I18N['zh'];
  labelEl.textContent = t.idle[state.mode] || m.idle;
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  document.querySelectorAll('.art').forEach(a => a.classList.remove('on'));
  const art = $('art-' + state.mode);
  if (art.src) art.classList.add('on');
}

function applyStats() {
  $('todayCount').textContent = state.todayCount;
  $('todayMin').textContent = state.todayMin;
  $('streak').textContent = state.streak;
}

function switchMode(mode) {
  stop();
  state.mode = mode;
  remaining = state.durations[mode];
  applyModeColors();
  render();
  LS.save(state);
}

function stop() {
  running = false;
  clearInterval(tickId);
  startBtn.textContent = (I18N[currentLang] || I18N['zh']).start;
}

function start() {
  if (remaining <= 0) remaining = state.durations[state.mode];
  running = true;
  endAt = Date.now() + remaining * 1000;
  startBtn.textContent = (I18N[currentLang] || I18N['zh']).pause;
  tickId = setInterval(() => {
    remaining = (endAt - Date.now()) / 1000;
    if (remaining <= 0) { remaining = 0; render(); finish(); }
    else render();
  }, 200);
  render();
}

function chime() {
  if (!state.sound) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ac = new Ctx();
    [[660, 0], [880, .18], [1100, .36]].forEach(([f, t]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(ac.destination);
      const s = ac.currentTime + t;
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(.22, s + .03);
      g.gain.exponentialRampToValueAtTime(.001, s + .5);
      o.start(s); o.stop(s + .55);
    });
  } catch (e) {}
}

function finish() {
  stop();
  timerEl.classList.add('done');
  chime();
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  if (state.mode === 'focus') {
    state.todayCount++;
    state.todayMin += Math.round(state.durations.focus / 60);
    // auto-suggest long break every 4th
    const next = state.todayCount % 4 === 0 ? 'longBreak' : 'shortBreak';
    switchMode(next);
    timerEl.classList.remove('done');
    render();
  } else {
    switchMode('focus');
    timerEl.classList.remove('done');
    render();
  }
  applyStats();
  LS.save(state);
}

// ---------- events ----------
startBtn.onclick = () => running ? (stop(), render()) : start();
$('resetBtn').onclick = () => { switchMode(state.mode); };
document.querySelectorAll('.modes button').forEach(b =>
  b.onclick = () => switchMode(b.dataset.mode));

function clampNum(el, min, max) {
  el.addEventListener('change', () => {
    let v = parseInt(el.value, 10);
    if (isNaN(v) || v < min) v = min;
    if (v > max) v = max;
    el.value = v;
  });
}
clampNum($('fMin'), 1, 120);
clampNum($('sMin'), 1, 60);
clampNum($('lMin'), 1, 60);

function syncDurations() {
  state.durations = {
    focus: $('fMin').value * 60,
    shortBreak: $('sMin').value * 60,
    longBreak: $('lMin').value * 60
  };
  LS.save(state);
  if (!running || !['focus','shortBreak','longBreak'].includes(state.mode)) {}
  if (!running) { remaining = state.durations[state.mode]; render(); }
}
$('fMin').onchange = syncDurations;
$('sMin').onchange = syncDurations;
$('lMin').onchange = syncDurations;
$('sound').onchange = e => { state.sound = e.target.checked; LS.save(state); };

window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|SELECT/.test(document.activeElement.tagName)) {
    e.preventDefault();
    startBtn.click();
  }
});

// ---------- language init ----------
let currentLang = localStorage.getItem('pomodoro_lang');
if (!currentLang || !I18N[currentLang]) {
  const nav = (navigator.language || 'zh').toLowerCase();
  if (nav.startsWith('zh-tw') || nav.startsWith('zh-hant') || nav === 'zh-hk') currentLang = 'zh-TW';
  else if (nav.startsWith('en')) currentLang = 'en';
  else if (nav.startsWith('ja')) currentLang = 'ja';
  else if (nav.startsWith('ko')) currentLang = 'ko';
  else currentLang = 'zh';
}
langSelect.value = currentLang;
langSelect.onchange = e => applyLang(e.target.value);
applyLang(currentLang);

// ---------- init ----------
applyModeColors();
applyStats();
render();
</script>
</body>
</html>
